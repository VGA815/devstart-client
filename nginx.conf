server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Reject hidden/dotfiles (.git, .env, ...) but keep ACME challenges working.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Fingerprinted build artifacts (outputHashing: all) — cache hard.
    # max-age задаётся прямо в add_header, а не через `expires`: тот шлёт свой
    # собственный Cache-Control, и заголовок уходил клиенту дважды.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # App shell + SPA client-side routing.
    # NOTE: nginx does not inherit add_header into a location that sets its own,
    # so the security headers are declared here explicitly (this is the HTML doc).
    location / {
        try_files $uri $uri/ /index.html;

        # The shell must not be cached, or clients pin a stale bundle after deploy.
        add_header Cache-Control "no-cache" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content-Security-Policy is opt-in (commented) to avoid white-screening on a
        # too-strict directive. The API and WebSocket are same-origin, but Google Fonts and
        # Yandex SmartCaptcha are not, so those hosts have to be enumerated.
        #
        # SmartCaptcha needs three directives, and missing any one breaks every auth page:
        #   script-src  — captcha.js itself
        #   frame-src   — the iframe holding the challenge shown to suspicious visitors
        #   connect-src — the widget's own XHRs
        # style-src already carries 'unsafe-inline', which the widget's injected styles need.
        # If CAPTCHA_SITE_KEY is empty the script is never loaded, so those hosts are harmless.
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://smartcaptcha.yandexcloud.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://smartcaptcha.yandexcloud.net https://captcha-api.yandex.ru; frame-src https://smartcaptcha.yandexcloud.net https://captcha-api.yandex.ru; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    }

    gzip on;
    gzip_min_length 1024;
    # gzip_vary: ответы с длинным max-age кэшируются посредниками, и без Vary
    # сжатая копия может уехать клиенту, который gzip не просил.
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/manifest+json text/plain;
}
