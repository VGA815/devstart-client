<div class="page">
  <header class="page__heading">
    <h1 class="page__title page__title--sm">Мои заявки на сотрудничество</h1>
  </header>

  <div class="cr-filter">
    <select class="field__select field__select--sm" (change)="selectStatus($any($event.target).value)">
      <option value="All">Все статусы</option>
      @for (s of statuses; track s) {
        <option [value]="s">{{ getStatusLabel(s) }}</option>
      }
    </select>
  </div>

  @if (loading()) {
    <div class="card card__body--flush">
      <app-skeleton height="56px" /><app-skeleton height="56px" /><app-skeleton height="56px" />
    </div>
  } @else if (requests().length === 0) {
    <div class="empty-state empty-state--card">
      <p class="empty-state__title">Заявок нет</p>
      <p class="empty-state__sub">
        Откройте каталог стартапов, чтобы отправить заявку. Для этого нужен профиль эксперта.
      </p>
      <a class="btn btn--primary" routerLink="/dashboard/expert-profile">Профиль эксперта</a>
    </div>
  } @else {
    <div class="card card__body--flush">
      @for (req of requests(); track req.id) {
        <app-collab-request-row
          [request]="req"
          viewerSide="expert"
          (accept)="accept($event)"
          (reject)="reject($event)"
          (withdraw)="withdraw($event)" />
      }
    </div>

    @if (hasMore()) {
      <div class="cr-more">
        <button class="btn btn--ghost" type="button" [disabled]="loadingMore()" (click)="loadMore()">
          {{ loadingMore() ? 'Загрузка…' : 'Показать ещё' }}
        </button>
      </div>
    }
  }
</div>
