<div class="dash-layout">

  <button class="dash-mobile-bar" type="button" (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarOpen()" aria-controls="admin-sidebar">
    <span class="dash-mobile-bar__icon">☰</span>
    <span class="dash-mobile-bar__text">Меню админ-панели</span>
  </button>

  @if (sidebarOpen()) {
    <div class="dash-overlay" (click)="closeSidebar()"></div>
  }

  <aside class="dash-sidebar" id="admin-sidebar" [class.dash-sidebar--open]="sidebarOpen()">

    <div class="dash-sidebar__group">
      <span class="dash-sidebar__group-label">Модерация</span>
      <a class="dash-sidebar__item" routerLink="users"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">👤</span>
        <span class="dash-sidebar__item-text">Пользователи</span>
      </a>
      <a class="dash-sidebar__item" routerLink="startups"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">🗂</span>
        <span class="dash-sidebar__item-text">Стартапы</span>
      </a>
    </div>

    <div class="dash-sidebar__group">
      <span class="dash-sidebar__group-label">Биллинг</span>
      <a class="dash-sidebar__item" routerLink="subscriptions"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">★</span>
        <span class="dash-sidebar__item-text">Подписки</span>
      </a>
      <a class="dash-sidebar__item" routerLink="service-orders"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">◇</span>
        <span class="dash-sidebar__item-text">Разовые услуги</span>
      </a>
      <a class="dash-sidebar__item" routerLink="promo-codes"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">%</span>
        <span class="dash-sidebar__item-text">Промокоды</span>
      </a>
    </div>

    <div class="dash-sidebar__group">
      <span class="dash-sidebar__group-label">Платформа</span>
      <a class="dash-sidebar__item" routerLink="benchmarks"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">📈</span>
        <span class="dash-sidebar__item-text">Бенчмарки оценки</span>
      </a>
      <a class="dash-sidebar__item" routerLink="legal"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">📋</span>
        <span class="dash-sidebar__item-text">Юр. документы</span>
      </a>
      <a class="dash-sidebar__item" routerLink="audit"
         routerLinkActive="dash-sidebar__item--active" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">🧾</span>
        <span class="dash-sidebar__item-text">Аудит-лог</span>
      </a>
    </div>

    <div class="dash-sidebar__group">
      <span class="dash-sidebar__group-label">Навигация</span>
      <a class="dash-sidebar__item" routerLink="/dashboard/overview" (click)="closeSidebar()">
        <span class="dash-sidebar__icon">←</span>
        <span class="dash-sidebar__item-text">В личный кабинет</span>
      </a>
    </div>

  </aside>

  <main class="dash-main">
    <router-outlet />
  </main>

</div>
